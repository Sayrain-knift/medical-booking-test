<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗预约系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-image {
            animation: fadeInRight 0.8s ease-out;
        }

        .feature-card {
            padding: 2rem;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .feature-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 2rem;
            color: white;
        }

        .department-card {
            padding: 1.5rem;
            border-radius: 10px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .department-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .department-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .doctor-card {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .doctor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .doctor-avatar {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero-section {
                min-height: auto;
                padding: 4rem 0;
            }
            
            .hero-content h1 {
                font-size: 2.5rem;
            }
            
            .hero-image {
                margin-top: 2rem;
            }
            
            .hero-image i {
                font-size: 8rem !important;
            }
        }

        /* 导航栏响应式优化 */
        @media (max-width: 991.98px) {
            .navbar-nav {
                text-align: center;
            }
            
            .nav-item {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-hospital text-primary me-2"></i>医疗预约系统
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/doctors.html">医生科室</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/appointment.html">预约挂号</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ai-consultation.html">AI问诊</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile.html">个人中心</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center">
                    <div id="userSection" class="d-none">
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle me-1"></i>
                                <span id="username">用户</span>
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="/profile.html">个人中心</a></li>
                                <li><a class="dropdown-item" href="/appointments.html">我的预约</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="authManager.logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </div>
                    <div id="authSection">
                        <a href="/login.html" class="btn btn-outline-primary me-2">登录</a>
                        <a href="/register.html" class="btn btn-primary">注册</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main style="padding-top: 80px;">
        <!-- 英雄区域 -->
        <section class="hero-section">
            <div class="container">
                <div class="row align-items-center min-vh-100">
                    <div class="col-lg-6">
                        <div class="hero-content">
                            <h1 class="display-4 fw-bold text-white mb-4">专业医疗，贴心服务</h1>
                            <p class="lead text-white-50 mb-4">在线预约挂号，告别排队烦恼。专业医生团队，为您提供优质的医疗服务。</p>
                            <div class="d-flex gap-3">
                                <a href="/appointment.html" class="btn btn-light btn-lg">
                                    <i class="bi bi-calendar-plus me-2"></i>立即预约
                                </a>
                                <a href="/ai-consultation.html" class="btn btn-outline-light btn-lg">
                                    <i class="bi bi-robot me-2"></i>AI问诊
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="hero-image text-center">
                            <i class="bi bi-hospital" style="font-size: 15rem; color: rgba(255,255,255,0.1);"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 特色服务 -->
        <section class="py-5 bg-light">
            <div class="container">
                <div class="row text-center">
                    <div class="col-md-4 mb-4">
                        <a href="/appointment.html" class="feature-card-link">
                            <div class="feature-card">
                                <div class="feature-icon mb-3">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                                <h4>在线预约</h4>
                                <p>24小时在线预约，随时选择心仪医生</p>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4 mb-4">
                        <a href="/doctors.html" class="feature-card-link">
                            <div class="feature-card">
                                <div class="feature-icon mb-3">
                                    <i class="bi bi-people"></i>
                                </div>
                                <h4>专业团队</h4>
                                <p>资深医生团队，提供专业诊疗服务</p>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4 mb-4">
                        <a href="/ai-consultation.html" class="feature-card-link">
                            <div class="feature-card">
                                <div class="feature-icon mb-3">
                                    <i class="bi bi-robot"></i>
                                </div>
                                <h4>AI问诊</h4>
                                <p>智能AI助手，提供健康咨询建议</p>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- 热门科室 -->
        <section class="py-5">
            <div class="container">
                <h2 class="text-center mb-5">热门科室</h2>
                <div class="row" id="departmentsContainer">
                    <!-- 科室数据将通过JavaScript动态加载 -->
                </div>
            </div>
        </section>

        <!-- 热门医生 -->
        <section class="py-5 bg-light">
            <div class="container">
                <h2 class="text-center mb-5">推荐医生</h2>
                <div class="row" id="doctorsContainer">
                    <!-- 医生数据将通过JavaScript动态加载 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>医疗预约系统</h5>
                    <p>为您提供专业、便捷的医疗服务</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2024 医疗预约系统. 保留所有权利.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/home.js"></script>
</body>
</html>
