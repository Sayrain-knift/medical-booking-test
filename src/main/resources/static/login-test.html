<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>登录测试</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">登录</div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" value="testpatient5">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" value="password123">
                            </div>
                            <button type="submit" class="btn btn-primary">登录</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">测试API</div>
                    <div class="card-body">
                        <button class="btn btn-success mb-3" onclick="testAppointments()">测试预约接口</button>
                        <button class="btn btn-info mb-3" onclick="checkToken()">检查Token</button>
                        <div id="result"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js?v=20240102"></script>
    <script>
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await ApiService.auth.login({ username, password });
                
                if (response.token) {
                    localStorage.setItem('token', response.token);
                    localStorage.setItem('user', JSON.stringify({
                        username: response.username,
                        role: response.role
                    }));
                    
                    document.getElementById('result').innerHTML = `
                        <div class="alert alert-success">
                            登录成功！<br>
                            Token: ${response.token.substring(0, 50)}...<br>
                            用户: ${response.username}<br>
                            角色: ${response.role}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-danger">
                        登录失败: ${error.message}
                    </div>
                `;
            }
        });

        // 测试预约接口
        async function testAppointments() {
            try {
                const response = await ApiService.appointments.getMyAppointments();
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-success">
                        预约接口调用成功！<br>
                        预约数量: ${response.data ? response.data.length : 0}<br>
                        <pre>${JSON.stringify(response, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-danger">
                        预约接口调用失败: ${error.message}
                    </div>
                `;
            }
        }

        // 检查Token
        function checkToken() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            document.getElementById('result').innerHTML = `
                <div class="alert alert-info">
                    Token: ${token ? token.substring(0, 50) + '...' : '无'}<br>
                    用户: ${user || '无'}
                </div>
            `;
        }
    </script>
</body>
</html>
