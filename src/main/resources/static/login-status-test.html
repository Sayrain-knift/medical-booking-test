<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录状态功能测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>登录状态功能测试</h1>
        
        <!-- 导航栏测试区域 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    <i class="bi bi-hospital text-primary me-2"></i>医疗预约系统
                </a>
                
                <div class="d-flex align-items-center">
                    <div id="userSection" class="d-none">
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle me-1"></i>
                                <span id="username">用户</span>
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="/profile.html">个人中心</a></li>
                                <li><a class="dropdown-item" href="/appointments.html">我的预约</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="authManager.logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </div>
                    <div id="authSection">
                        <a href="/login" class="btn btn-outline-primary me-2">登录</a>
                        <a href="/register" class="btn btn-primary">注册</a>
                    </div>
                </div>
            </div>
        </nav>
        
        <!-- 测试控制面板 -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>测试控制</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary me-2" onclick="runTest()">运行完整测试</button>
                        <button class="btn btn-success me-2" onclick="simulateLogin()">模拟登录</button>
                        <button class="btn btn-danger me-2" onclick="simulateLogout()">模拟退出</button>
                        <button class="btn btn-info" onclick="checkCurrentStatus()">检查当前状态</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>当前状态</h5>
                    </div>
                    <div class="card-body">
                        <div id="statusDisplay">
                            <p><strong>登录状态:</strong> <span id="loginStatus">检查中...</span></p>
                            <p><strong>当前用户:</strong> <span id="currentUser">无</span></p>
                            <p><strong>AuthSection可见:</strong> <span id="authVisible">检查中...</span></p>
                            <p><strong>UserSection可见:</strong> <span id="userVisible">检查中...</span></p>
                            <p><strong>Token存在:</strong> <span id="tokenExists">检查中...</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 测试日志 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>测试日志</h5>
                    </div>
                    <div class="card-body">
                        <div id="testLog" class="bg-light p-3" style="height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px;">
                            等待测试开始...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let logElement = document.getElementById('testLog');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        function updateStatusDisplay() {
            const loginStatus = document.getElementById('loginStatus');
            const currentUser = document.getElementById('currentUser');
            const authVisible = document.getElementById('authVisible');
            const userVisible = document.getElementById('userVisible');
            const tokenExists = document.getElementById('tokenExists');
            
            const isLoggedIn = authManager.isLoggedIn();
            const user = authManager.getCurrentUser();
            const authSection = document.getElementById('authSection');
            const userSection = document.getElementById('userSection');
            const token = localStorage.getItem('token');
            
            loginStatus.textContent = isLoggedIn ? '已登录' : '未登录';
            loginStatus.className = isLoggedIn ? 'text-success' : 'text-warning';
            currentUser.textContent = user ? user.username : '无';
            authVisible.textContent = authSection ? !authSection.classList.contains('d-none') : '元素不存在';
            userVisible.textContent = userSection ? !userSection.classList.contains('d-none') : '元素不存在';
            tokenExists.textContent = !!token;
        }
        
        function runTest() {
            log('开始运行完整测试...');
            
            // 检查AuthManager
            if (typeof authManager !== 'undefined') {
                log('✓ AuthManager 已正确初始化');
            } else {
                log('✗ AuthManager 未找到');
                return;
            }
            
            // 检查DOM元素
            const authSection = document.getElementById('authSection');
            const userSection = document.getElementById('userSection');
            const usernameSpan = document.getElementById('username');
            
            log('authSection 元素: ' + (authSection ? '存在' : '不存在'));
            log('userSection 元素: ' + (userSection ? '存在' : '不存在'));
            log('usernameSpan 元素: ' + (usernameSpan ? '存在' : '不存在'));
            
            updateStatusDisplay();
            
            // 测试登录
            setTimeout(() => {
                log('测试模拟登录...');
                simulateLogin();
            }, 1000);
            
            // 测试退出
            setTimeout(() => {
                log('测试模拟退出...');
                simulateLogout();
            }, 3000);
            
            setTimeout(() => {
                log('测试完成！');
                updateStatusDisplay();
            }, 4000);
        }
        
        function simulateLogin() {
            const mockUser = {
                username: 'testuser',
                role: 'PATIENT'
            };
            
            localStorage.setItem('token', 'mock.jwt.token');
            localStorage.setItem('user', JSON.stringify(mockUser));
            authManager.currentUser = mockUser;
            authManager.updateUI();
            
            log('模拟登录完成');
            updateStatusDisplay();
        }
        
        function simulateLogout() {
            authManager.logout();
            log('模拟退出完成');
            updateStatusDisplay();
        }
        
        function checkCurrentStatus() {
            updateStatusDisplay();
            log('状态检查完成');
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                log('页面加载完成，开始初始化检查...');
                updateStatusDisplay();
                log('初始状态检查完成');
            }, 500);
        });
    </script>
</body>
</html>
