server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:h2:mem:medical_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # 在测试环境中禁用缓存
  cache:
    type: none

  # 配置一个不存在的Redis地址，避免连接真实Redis
  redis:
    host: localhost
    port: 16379  # 使用一个不存在的端口
    database: 1
    timeout: 1000ms
    lettuce:
      pool:
        max-active: 1
        max-idle: 1
        min-idle: 0

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

springdoc:
  api-docs:
    enabled: false

# 禁用Nacos服务注册和发现
cloud:
  nacos:
    discovery:
      enabled: false
      register-enabled: false
    config:
      enabled: false

jwt:
  secret: test_secret_key_123456789012345678901234567890
  expiration: 3600000
  header: Authorization
  prefix: Bearer

logging:
  level:
    root: INFO
    com.sayrain.medicalbooking: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE